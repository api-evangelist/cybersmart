aid: cybersmart
name: CyberSmart
description: >-
  CyberSmart is a UK-based cybersecurity platform for SMEs and the managed
  service providers (MSPs) that serve them, backed by Seedcamp. It automates
  security certification and continuous compliance — including government-backed
  Cyber Essentials, Cyber Essentials Plus, IASME and GDPR readiness — alongside
  device-level security monitoring, patch management, policy management, security
  awareness training, and cyber insurance. Partners integrate CyberSmart through
  its OAuth2-authenticated Ticketing API, which exposes certifications and
  desktop security controls so MSPs can automate workflows and sync device
  security and compliance data into their own systems. The company operates a
  four-tier partner program (Registered, Growth, Advanced, Strategic) and is
  independently certified to ISO/IEC 27001.
