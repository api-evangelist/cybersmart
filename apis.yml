apis:
- name: CyberSmart Ticketing API
  description: >-
    Partner-facing REST API that provides full access to certifications and
    desktop security controls, allowing MSP partners to automate security
    workflows, integrate with other systems, and sync device security and
    compliance data. Authenticated with OAuth2 credentials issued at the partner
    level (one credential set covers all managed organisations). Available to all
    CyberSmart Partners regardless of tier; not currently available to direct
    customers.
